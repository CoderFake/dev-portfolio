<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Liquid Glass Squircle Background Gradient -->
    <linearGradient id="cf-bg-grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F3FF" />
      <stop offset="52%" stop-color="#EDE9FE" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Ambient Primary Core Glow -->
    <radialGradient id="cf-ambient-glow" cx="60" cy="60" r="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#6D5DF6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <!-- Primary UI Theme Gradient for 'C' Arc (Violet -> Indigo -> Sky Cyan) -->
    <linearGradient id="cf-c-fill" x1="16" y1="20" x2="92" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="38%" stop-color="#7C3AED" />
      <stop offset="72%" stop-color="#6D5DF6" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Primary UI Theme Gradient for 'F' Slash Monogram -->
    <linearGradient id="cf-f-fill" x1="40" y1="42" x2="100" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="48%" stop-color="#6D5DF6" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- Luminous Edge Rim Gradient -->
    <linearGradient id="cf-rim-grad" x1="16" y1="18" x2="100" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="45%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Soft Drop Shadow in Primary Indigo -->
    <filter id="cf-glow" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#6D5DF6" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Frosted Liquid Glass Squircle Base -->
  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#cf-bg-grad)" />
  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#cf-ambient-glow)" />

  <!-- Subtle Architectural Circuit Grid Lines -->
  <g stroke="#6D5DF6" stroke-opacity="0.09" stroke-width="1">
    <path d="M22 2 V118 M98 2 V118 M2 26 H118 M2 94 H118" />
    <path d="M14 42 H32 L42 32 V14 M106 78 H88 L78 88 V106" />
  </g>

  <!-- Specular Glass Border -->
  <rect x="3" y="3" width="114" height="114" rx="27" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.5" />
  <rect x="2" y="2" width="116" height="116" rx="28" stroke="#8B5CF6" stroke-opacity="0.32" stroke-width="1.2" />

  <!-- CF Monogram Vector Group -->
  <g filter="url(#cf-glow)">
    <!-- 1. Upper-Left 'C' Arc -->
    <path
      d="M 86.1 28.8 A 42 42 0 1 0 35.5 95.5 L 41.2 84.8 A 30 30 0 1 1 78.1 37.7 Z"
      fill="url(#cf-c-fill)"
      stroke="url(#cf-rim-grad)"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
    <!-- Inner Glass Groove on Upper-Left 'C' -->
    <path
      d="M 80.5 34.2 A 36 36 0 1 0 38.6 89.2"
      stroke="#F5F3FF"
      stroke-opacity="0.82"
      stroke-width="1.6"
      stroke-linecap="round"
    />

    <!-- 2. Lower-Right 'C' Tail Arc -->
    <path
      d="M 48.5 100.9 A 42 42 0 0 0 92.0 84.7 L 82.3 77.6 A 30 30 0 0 1 53.5 89.7 Z"
      fill="url(#cf-c-fill)"
      stroke="url(#cf-rim-grad)"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
    <!-- Inner Glass Groove on Lower-Right 'C' -->
    <path
      d="M 51.4 94.8 A 36 36 0 0 0 86.5 80.8"
      stroke="#E0F2FE"
      stroke-opacity="0.85"
      stroke-width="1.6"
      stroke-linecap="round"
    />

    <!-- 3. Center Italicized 'F' Slash Monogram -->
    <path
      d="M 40.0 105.0 L 61.0 43.0 H 99.0 L 93.2 55.0 H 68.8 L 63.6 68.0 H 86.0 L 80.2 79.5 H 59.0 L 49.0 98.5 Z"
      fill="url(#cf-f-fill)"
      stroke="url(#cf-rim-grad)"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
    <!-- Specular Inner Tech Lines inside 'F' -->
    <path
      d="M 45.2 95.5 L 64.6 49.0 H 92.5 M 61.2 73.8 H 79.8"
      stroke="#FFFFFF"
      stroke-opacity="0.88"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
